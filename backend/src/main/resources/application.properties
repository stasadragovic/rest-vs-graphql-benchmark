spring.application.name=taskboard

spring.datasource.url=jdbc:postgresql://localhost:5432/projectdb
spring.datasource.username=diplomski
spring.datasource.password=diplomski

# Semu pravi iskljucivo database/schema.sql, Hibernate je samo proverava
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# true = optimizovana GraphQL varijanta (@BatchMapping), false = naivna (N+1)
taskboard.graphql.batching=true

spring.graphql.graphiql.enabled=true


taskboard.cors.allowed-origins=http://localhost:5173

spring.config.import=optional:file:.env[.properties]
taskboard.jwt.secret=${JWT_SECRET}
taskboard.jwt.expiration=24h
